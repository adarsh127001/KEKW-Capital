<!doctype html><html lang="en"><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><title>KEKW CONTROL</title><style>:root{color-scheme:dark;--ink:#061017;--cyan:#12f6ff;--crimson:#ff365f;--amber:#FFB53D}
@font-face{font-family:"IBM Plex Mono";src:url("/static/fonts/ibm-plex-mono/IBMPlexMono-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/static/fonts/ibm-plex-mono/IBMPlexMono-SemiBold.woff2") format("woff2");font-style:normal;font-weight:600 700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--cyan);font:24px "IBM Plex Mono",monospace;padding:32px}
h1,h2{color:var(--cyan);background:var(--ink);font-size:40px;line-height:1.15;font-weight:700;letter-spacing:.01em;margin:0 0 16px}
section{position:relative;isolation:isolate;border:1px solid var(--cyan);padding:18px;margin:14px 0;background:var(--ink);border-radius:0}
section::before,section::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
section::before{background:linear-gradient(var(--cyan),var(--cyan)) left top/22px 1px no-repeat,linear-gradient(var(--cyan),var(--cyan)) left top/1px 22px no-repeat,linear-gradient(var(--cyan),var(--cyan)) right top/22px 1px no-repeat,linear-gradient(var(--cyan),var(--cyan)) right top/1px 22px no-repeat}
section::after{background:linear-gradient(var(--cyan),var(--cyan)) left bottom/22px 1px no-repeat,linear-gradient(var(--cyan),var(--cyan)) left bottom/1px 22px no-repeat,linear-gradient(var(--cyan),var(--cyan)) right bottom/22px 1px no-repeat,linear-gradient(var(--cyan),var(--cyan)) right bottom/1px 22px no-repeat}
button,select,input{font:24px "IBM Plex Mono",monospace;min-height:56px;padding:12px 14px;margin:8px;background:var(--ink);color:var(--cyan);border:1px solid var(--cyan);border-radius:0}
label{display:inline-block;min-width:180px;color:var(--cyan);font-size:24px;line-height:1.2}button{cursor:pointer;font-weight:600}
button:hover,button:active{background:var(--cyan);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
input::placeholder{color:rgba(18,246,255,.78);opacity:1}
select option{background:var(--ink);color:var(--cyan)}p{color:var(--cyan);background:var(--ink)}
#log{min-height:48px;padding:14px;border:1px solid var(--cyan);color:var(--cyan);font:24px/1.35 "IBM Plex Mono",monospace;white-space:pre-wrap}
@media(max-width:800px){body{padding:18px}section{padding:14px}label{display:block;min-width:0;margin:8px}button,select,input{max-width:100%}}</style><h1>KEKW CAPITAL · CONTROL DECK</h1><section><h2>1 · MODE</h2><label for="mode">Mode</label><select id="mode"><option>LIVE</option><option>PIT</option><option selected>SHOWCASE</option></select><button onclick="post('/control/mode/'+mode.value)">Set mode</button></section><section><h2>2 · PRIME TIME /stake</h2><label for="title">Contract title</label><input id="title" value="Will KEKW moon?"><button onclick="stake()">Open 60s stake</button><label for="cid">Contract ID</label><input id="cid" placeholder="contract id"><label for="winner">Winner ticker</label><input id="winner" value="KEKW_YES"><label for="key">Settle key</label><input id="key" placeholder="settle key"><button onclick="settle()">Settle key</button></section><section><h2>PROBE / FORCE IPO</h2><label for="emote">Emote ticker</label><input id="emote" placeholder="Emote ticker"><button onclick="probeTicker()">Probe</button><button onclick="foundTicker()">Force !found</button></section><section><h2>4 · RED-KEY / FORCE-CRASH / RECAP</h2><button onclick="post('/control/red-key')">RED-KEY</button><button onclick="post('/control/force-crash')">Force crash</button><button onclick="post('/control/recap')">Generate recap</button></section><pre id="log" role="status" aria-live="polite" aria-atomic="true"></pre><script>
async function post(url,body={}){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});log.textContent=JSON.stringify(await r.json(),null,2)}
async function stake(){let r=await fetch('/control/stake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,window:60})});let d=await r.json();cid.value=d.id;winner.value=d.yes;log.textContent=JSON.stringify(d,null,2)}
async function settle(){let r=await fetch('/control/settle',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({contract_id:cid.value,winner:winner.value,key:key.value})});log.textContent=JSON.stringify(await r.json(),null,2)}
async function probeTicker(){await post("/control/probe",{emote:emote.value})}async function foundTicker(){await post("/control/found",{emote:emote.value})}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.target.matches('input,select,textarea'))return;const key=e.key.toLowerCase();if(key==='1'){e.preventDefault();post('/control/mode/'+mode.value)}else if(key==='2'){e.preventDefault();stake()}else if(key==='3'){e.preventDefault();probeTicker()}else if(key==='r'){e.preventDefault();post('/control/red-key')}})
</script><p>Keyboard macros: 1 set the selected mode · 2 open PRIME TIME · 3 probe the emote · R RED-KEY.</p></html>
